<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen Z Slang Arena & Translator</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            /* TV Girl aesthetic palette: Deep French Blue, Bright Cyan, Electric Pink, & Magenta */
            background-color: #0d1b2a;
            background-image: 
                radial-gradient(circle at 30% 20%, rgba(244, 114, 182, 0.25), transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.25), transparent 60%),
                repeating-linear-gradient(0deg, transparent, transparent 18px, rgba(236, 72, 153, 0.08) 18px, rgba(236, 72, 153, 0.08) 20px),
                repeating-linear-gradient(90deg, #112240, #112240 18px, #0e1a30 18px, #0e1a30 20px);
            background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
            color: #f9fafb;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        
        .stardew-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* TV Girl Stardew UI Panel Framing Style */
        .stardew-card {
            background-color: #1e1b4b;
            border: 4px solid #f472b6;
            box-shadow: 
                inset 0 0 0 4px #831843,
                inset 0 0 0 6px #0f172a,
                0 8px 0 0 rgba(0, 0, 0, 0.5);
        }

        .stardew-box {
            background-color: #fce7f3;
            border: 3px solid #db2777;
            color: #831843;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.FramerMotion || window.Motion;

        // --- CONSTANTS & MAPPINGS ---
        const STYLES = [
            { id: 'genz', name: 'Gen Z / Brainrot', icon: '💀', desc: 'Maximum bussin brainrot vibes' },
            { id: 'reverse', name: 'Brainrot -> Normal', icon: '🧹', desc: 'Translate slang back to plain English' },
            { id: 'shakespeare', name: 'Shakespearean', icon: '📜', desc: 'Verily, thou art goated' },
            { id: 'british', name: 'British Roadman', icon: '☕', desc: 'Allow it fam, bare vibes' },
            { id: 'pirate', name: 'Pirate', icon: '🏴‍☠️', desc: 'Ahoy matey, ye got rizz' },
            { id: 'formal', name: 'Overly Formal', icon: '🎩', desc: 'Extremely sophisticated prose' }
        ];

        const GENZ_DICT = {
            "hello": "yo chat", "friend": "blud", "friends": "the squad", "good": "bussin",
            "great": "w", "cool": "sigma", "bad": "L", "lie": "cap", "truth": "no cap",
            "yes": "fr fr", "very": "mad", "crazy": "unhinged", "attractive": "rizzler",
            "charisma": "rizz", "steal": "fanum tax", "stole": "fanum taxed", "food": "gyatt food",
            "fool": "skibidi NPC", "weird": "sus", "best": "goated", "defeated": "cooked",
            "focused": "locked in", "money": "mewing funds", "bro": "chat"
        };

        const SUFFIXES = [" fr fr", " no cap", " in Ohio", " lowkey", " (real)", " skibidi style"];

        const PROMPTS = [
            "I am currently focusing very hard on completing my homework.",
            "My friend stole my food while I was not looking.",
            "That new video game is extremely good and impressive.",
            "He tried to look stylish, but he embarrassed himself in public.",
            "I am telling you the truth, I won the competition fairly."
        ];

        // --- AURA RANK SYSTEM ---
        const getRankInfo = (aura) => {
            if (aura >= 1500) return { title: 'GigaChad Supreme', color: 'from-pink-400 to-sky-400', icon: '👑' };
            if (aura >= 1000) return { title: 'Aura Master', color: 'from-sky-400 to-pink-500', icon: '🔮' };
            if (aura >= 750) return { title: 'Valid', color: 'from-cyan-400 to-pink-400', icon: '⚡' };
            if (aura >= 500) return { title: 'Aura Apprentice', color: 'from-pink-300 to-blue-400', icon: '✨' };
            if (aura >= 250) return { title: 'Certified', color: 'from-sky-300 to-pink-400', icon: '🎖️' };
            if (aura >= 100) return { title: 'Side Character', color: 'from-slate-400 to-slate-200', icon: '👤' };
            return { title: 'NPC', color: 'from-slate-600 to-slate-400', icon: '🤖' };
        };

        // --- MASCOT COMPONENT ---
        const Mascot = ({ state }) => {
            const mascotVariants = {
                idle: { y: [0, -6, 0], transition: { duration: 2.5, repeat: Infinity, ease: "easeInOut" } },
                typing: { scale: [1, 1.05, 1], rotate: [0, 2, -2, 0], transition: { duration: 0.3, repeat: Infinity } },
                thinking: { rotate: [0, 360], transition: { duration: 2, repeat: Infinity, ease: "linear" } },
                celebrate: { y: [0, -20, 0], scale: [1, 1.15, 1], transition: { duration: 0.4, repeat: 3 } },
                sad: { y: [0, 6, 0], opacity: 0.8, transition: { duration: 1.5, repeat: Infinity } }
            };

            return (
                <div className="relative w-28 h-28 mx-auto">
                    <motion.div animate={mascotVariants[state] || mascotVariants.idle} className="w-full h-full">
                        <svg viewBox="0 0 16 16" className="w-full h-full drop-shadow-[0_4px_12px_rgba(244,114,182,0.4)]" style={{ shapeRendering: 'crispEdges' }}>
                            {/* Ears */}
                            <rect x="2" y="1" width="3" height="4" fill="#38bdf8" />
                            <rect x="3" y="2" width="1" height="2" fill="#f43f5e" />
                            <rect x="11" y="1" width="3" height="4" fill="#38bdf8" />
                            <rect x="12" y="2" width="1" height="2" fill="#f43f5e" />

                            {/* Head Base */}
                            <rect x="2" y="4" width="12" height="9" fill="#38bdf8" />
                            <rect x="3" y="13" width="10" height="1" fill="#38bdf8" />

                            {/* Cheek Details */}
                            <rect x="1" y="7" width="1" height="4" fill="#0284c7" />
                            <rect x="14" y="7" width="1" height="4" fill="#0284c7" />

                            {/* Eyes based on state */}
                            {state === 'thinking' ? (
                                <>
                                    <rect x="4" y="7" width="3" height="1" fill="#0f172a" />
                                    <rect x="9" y="7" width="3" height="1" fill="#0f172a" />
                                </>
                            ) : state === 'sad' ? (
                                <>
                                    <rect x="4" y="8" width="2" height="1" fill="#0f172a" />
                                    <rect x="10" y="8" width="2" height="1" fill="#0f172a" />
                                    <rect x="5" y="7" width="1" height="1" fill="#0f172a" />
                                    <rect x="11" y="7" width="1" height="1" fill="#0f172a" />
                                </>
                            ) : state === 'celebrate' ? (
                                <>
                                    <rect x="4" y="7" width="2" height="1" fill="#0f172a" />
                                    <rect x="10" y="7" width="2" height="1" fill="#0f172a" />
                                    <rect x="3" y="8" width="1" height="1" fill="#0f172a" />
                                    <rect x="5" y="8" width="1" height="1" fill="#0f172a" />
                                    <rect x="9" y="8" width="1" height="1" fill="#0f172a" />
                                    <rect x="12" y="8" width="1" height="1" fill="#0f172a" />
                                </>
                            ) : (
                                <>
                                    <rect x="4" y="7" width="2" height="2" fill="#0f172a" />
                                    <rect x="10" y="7" width="2" height="2" fill="#0f172a" />
                                    <rect x="4" y="7" width="1" height="1" fill="#ffffff" />
                                    <rect x="10" y="7" width="1" height="1" fill="#ffffff" />
                                </>
                            )}

                            {/* Nose */}
                            <rect x="7" y="9" width="2" height="1" fill="#f43f5e" />

                            {/* Mouth */}
                            {state === 'celebrate' ? (
                                <rect x="6" y="10" width="4" height="2" fill="#a855f7" />
                            ) : (
                                <>
                                    <rect x="6" y="10" width="1" height="1" fill="#a855f7" />
                                    <rect x="9" y="10" width="1" height="1" fill="#a855f7" />
                                    <rect x="7" y="11" width="2" height="1" fill="#a855f7" />
                                </>
                            )}

                            {/* Whiskers */}
                            <rect x="0" y="8" width="2" height="1" fill="#e0f2fe" />
                            <rect x="0" y="10" width="2" height="1" fill="#e0f2fe" />
                            <rect x="14" y="8" width="2" height="1" fill="#e0f2fe" />
                            <rect x="14" y="10" width="2" height="1" fill="#e0f2fe" />
                        </svg>
                    </motion.div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [selectedStyle, setSelectedStyle] = useState('genz');
            const [inputText, setInputText] = useState('');
            const [translatedText, setTranslatedText] = useState('');
            const [history, setHistory] = useState([]);
            const [mascotState, setMascotState] = useState('idle');
            
            // Game State
            const [user, setUser] = useState(null);
            const [usernameInput, setUsernameInput] = useState('');
            const [currentPromptIndex, setCurrentPromptIndex] = useState(0);
            const [gameInput, setGameInput] = useState('');
            const [evaluating, setEvaluating] = useState(false);
            const [scoreModal, setScoreModal] = useState(null);
            const [leaderboard, setLeaderboard] = useState([]);

            useEffect(() => {
                const savedLB = JSON.parse(localStorage.getItem('genz_arena_lb') || '[]');
                if (savedLB.length === 0) {
                    const mockLB = [
                        { id: 1, username: 'RizzGod99', total_aura: 1850, highest_score: 98, games_played: 20, badges: ['GigaChad Supreme', 'Sigma Master'] },
                        { id: 2, username: 'SkibidiKing', total_aura: 1120, highest_score: 92, games_played: 14, badges: ['Aura Overlord'] },
                        { id: 3, username: 'GyattWatcher', total_aura: 640, highest_score: 85, games_played: 8, badges: ['Aura Apprentice'] }
                    ];
                    setLeaderboard(mockLB);
                    localStorage.setItem('genz_arena_lb', JSON.stringify(mockLB));
                } else {
                    setLeaderboard(savedLB);
                }
            }, []);

            const handleTranslate = () => {
                if (!inputText.trim()) return;
                setMascotState('thinking');
                
                setTimeout(() => {
                    let result = "";
                    const words = inputText.split(/\s+/);

                    if (selectedStyle === 'genz') {
                        const translated = words.map(w => {
                            const clean = w.toLowerCase().replace(/[^\w]/g, "");
                            return GENZ_DICT[clean] ? w.toLowerCase().replace(clean, GENZ_DICT[clean]) : w;
                        });
                        result = translated.join(" ") + SUFFIXES[Math.floor(Math.random() * SUFFIXES.length)];
                    } else if (selectedStyle === 'reverse') {
                        const reverseMap = Object.fromEntries(Object.entries(GENZ_DICT).map(([k, v]) => [v, k]));
                        result = words.map(w => reverseMap[w.toLowerCase()] || w).join(" ");
                    } else if (selectedStyle === 'shakespeare') {
                        result = "Hark! " + words.map(w => w + "eth").join(" ") + ", verily fine sir.";
                    } else if (selectedStyle === 'british') {
                        result = "Allow it fam, " + words.join(" ") + " is proper mad innit, bruv.";
                    } else if (selectedStyle === 'pirate') {
                        result = "Ahoy matey! " + words.join(" ") + " by order of Cap'n!";
                    } else {
                        result = "It is hereby formally recognized that " + words.join(" ") + ".";
                    }

                    setTranslatedText(result);
                    setHistory(prev => [{ id: Date.now(), original: inputText, translated: result, style: selectedStyle }, ...prev.slice(0, 4)]);
                    setMascotState('celebrate');
                    setTimeout(() => setMascotState('idle'), 2000);
                }, 400);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!usernameInput.trim()) return;
                
                const existing = leaderboard.find(u => u.username.toLowerCase() === usernameInput.trim().toLowerCase());
                const currentUser = existing || {
                    id: Date.now(),
                    username: usernameInput.trim(),
                    total_aura: 0,
                    highest_score: 0,
                    games_played: 0,
                    badges: []
                };
                
                setUser(currentUser);
            };

            const evaluateGameSubmission = () => {
                if (!gameInput.trim()) return;
                setEvaluating(true);
                setMascotState('thinking');

                setTimeout(() => {
                    const wordCount = gameInput.trim().split(/\s+/).length;
                    const slangMatches = Object.values(GENZ_DICT).filter(slang => gameInput.toLowerCase().includes(slang)).length;

                    const slangScore = Math.min(100, slangMatches * 30 + 20);
                    const naturalness = wordCount >= 4 && slangMatches <= 3 ? 88 : 55;
                    const meaning = 82;
                    const creativity = Math.min(100, 45 + slangMatches * 15);
                    const overall = Math.round((slangScore + naturalness + meaning + creativity) / 4);

                    const newTotalAura = user.total_aura + overall;
                    const newHighest = Math.max(user.highest_score, overall);
                    const newGames = user.games_played + 1;

                    const updatedBadges = [...(user.badges || [])];
                    if (overall >= 90 && !updatedBadges.includes('Sigma Master')) updatedBadges.push('Sigma Master');
                    if (newTotalAura >= 500 && !updatedBadges.includes('Aura Overlord')) updatedBadges.push('Aura Overlord');

                    const updatedUser = { ...user, total_aura: newTotalAura, highest_score: newHighest, games_played: newGames, badges: updatedBadges };
                    setUser(updatedUser);

                    const newLB = leaderboard.map(u => u.id === updatedUser.id ? updatedUser : u);
                    if (!newLB.some(u => u.id === updatedUser.id)) newLB.push(updatedUser);
                    newLB.sort((a, b) => b.total_aura - a.total_aura);
                    
                    setLeaderboard(newLB);
                    localStorage.setItem('genz_arena_lb', JSON.stringify(newLB));

                    const resultData = {
                        overall,
                        meaning,
                        slangScore,
                        naturalness,
                        creativity,
                        feedback: overall > 75 ? "W submission fr fr, you locked in!" : "Kind of mid, needs more brainrot energy."
                    };

                    setScoreModal(resultData);
                    setEvaluating(false);

                    if (overall >= 70) {
                        setMascotState('celebrate');
                        if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    } else {
                        setMascotState('sad');
                    }
                }, 1000);
            };

            const nextPrompt = () => {
                setScoreModal(null);
                setGameInput('');
                setCurrentPromptIndex((prev) => (prev + 1) % PROMPTS.length);
                setMascotState('idle');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* NAVBAR */}
                    <nav className="border-b-4 border-fuchsia-900 bg-[#0d1527]/90 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-lg">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                            <span className="text-2xl">💀</span>
                            <span className="stardew-font font-bold text-sm md:text-base text-pink-400 drop-shadow-[0_2px_0_#000]">SlangArena</span>
                        </div>

                        <div className="flex space-x-2 md:space-x-4">
                            {['home', 'translator', 'game', 'leaderboard'].map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm font-bold capitalize transition border-2 ${
                                        activeTab === tab 
                                            ? 'bg-pink-500 text-slate-950 border-pink-300 shadow-md' 
                                            : 'bg-slate-900/80 text-sky-300 border-sky-800 hover:bg-slate-800'
                                    }`}
                                >
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">
                        
                        {/* HOME TAB */}
                        {activeTab === 'home' && (
                            <div className="text-center py-12 md:py-16 space-y-8">
                                <Mascot state={mascotState} />
                                <div className="space-y-4 max-w-2xl mx-auto stardew-card p-6 md:p-8 rounded-xl">
                                    <h1 className="text-2xl md:text-4xl font-extrabold text-pink-300 drop-shadow-[0_3px_0_#000]">
                                        Speak normal? <span className="text-sky-400">That's crazy.</span>
                                    </h1>
                                    <p className="text-sky-100 text-sm md:text-base leading-relaxed">
                                        Translate standard English into brainrot Gen Z slang, battle in competitive rewrite challenges, earn Aura, and climb the global leaderboard.
                                    </p>
                                </div>

                                <div className="flex flex-col sm:flex-row justify-center gap-4 pt-2">
                                    <button 
                                        onClick={() => setActiveTab('translator')}
                                        className="px-6 py-4 bg-pink-500 border-4 border-pink-300 text-slate-950 rounded-xl font-bold text-base hover:bg-pink-400 hover:scale-105 transition shadow-lg"
                                    >
                                        Open Translator 🚀
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('game')}
                                        className="px-6 py-4 bg-sky-500 border-4 border-sky-300 text-slate-950 rounded-xl font-bold text-base hover:bg-sky-400 hover:scale-105 transition shadow-lg"
                                    >
                                        Enter Aura Arena ⚔️
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* TRANSLATOR TAB */}
                        {activeTab === 'translator' && (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between stardew-card p-4 rounded-xl">
                                    <h2 className="text-xl font-bold text-pink-300 drop-shadow-[0_2px_0_#000]">Slang Translator</h2>
                                    <Mascot state={mascotState} />
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                    {STYLES.map(style => (
                                        <div
                                            key={style.id}
                                            onClick={() => setSelectedStyle(style.id)}
                                            className={`p-4 rounded-xl border-4 cursor-pointer transition-all flex flex-col space-y-1 ${
                                                selectedStyle === style.id
                                                    ? 'border-pink-300 bg-pink-950/80 text-pink-200 shadow-lg'
                                                    : 'border-slate-800 bg-slate-900/80 text-sky-200 hover:border-sky-600'
                                            }`}
                                        >
                                            <div className="flex items-center space-x-2">
                                                <span className="text-xl">{style.icon}</span>
                                                <span className="font-bold text-sm text-pink-300">{style.name}</span>
                                            </div>
                                            <span className="text-xs text-sky-200/70">{style.desc}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-3">
                                    <textarea
                                        value={inputText}
                                        onChange={(e) => {
                                            setInputText(e.target.value);
                                            setMascotState(e.target.value ? 'typing' : 'idle');
                                        }}
                                        placeholder="Type standard English sentence here..."
                                        className="w-full h-32 p-4 stardew-box rounded-xl text-base font-semibold focus:outline-none focus:ring-4 focus:ring-pink-400 transition"
                                    />
                                    <div className="flex gap-2">
                                        <button
                                            onClick={handleTranslate}
                                            className="flex-1 py-3 bg-pink-500 border-4 border-pink-300 text-slate-950 font-bold rounded-xl hover:bg-pink-400 transition shadow-md"
                                        >
                                            Translate Sentence
                                        </button>
                                        <button
                                            onClick={() => { setInputText(''); setTranslatedText(''); setMascotState('idle'); }}
                                            className="px-4 py-3 bg-slate-900 border-2 border-slate-700 text-sky-300 rounded-xl hover:text-white"
                                        >
                                            Clear
                                        </button>
                                    </div>
                                </div>

                                {translatedText && (
                                    <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className="p-5 stardew-card rounded-xl space-y-2 relative">
                                        <div className="text-xs font-bold text-sky-400 uppercase tracking-wider">Converted Output</div>
                                        <div className="text-lg font-bold text-pink-300 pr-16">{translatedText}</div>
                                        <button
                                            onClick={() => navigator.clipboard.writeText(translatedText)}
                                            className="absolute top-4 right-4 text-xs bg-pink-900 text-pink-200 border-2 border-pink-600 px-3 py-1 rounded-lg hover:bg-pink-800"
                                        >
                                            Copy
                                        </button>
                                    </motion.div>
                                )}

                                {history.length > 0 && (
                                    <div className="space-y-2 pt-4">
                                        <h3 className="text-sm font-bold text-pink-300 drop-shadow-[0_1px_0_#000]">Session History</h3>
                                        <div className="space-y-2">
                                            {history.map(item => (
                                                <div key={item.id} className="p-3 bg-slate-900/80 border-2 border-slate-800 rounded-lg text-xs space-y-1">
                                                    <div className="text-sky-200">"{item.original}"</div>
                                                    <div className="text-pink-400 font-semibold">↳ "{item.translated}"</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* COMPETITIVE GAME TAB */}
                        {activeTab === 'game' && (
                            <div className="max-w-2xl mx-auto space-y-6">
                                {!user ? (
                                    <form onSubmit={handleLogin} className="p-8 stardew-card rounded-2xl text-center space-y-4">
                                        <Mascot state="idle" />
                                        <h2 className="text-2xl font-bold text-pink-300">Enter Aura Arena</h2>
                                        <p className="text-sky-100 text-sm">Choose a username to track your Aura rank and join the global leaderboard.</p>
                                        <input
                                            type="text"
                                            value={usernameInput}
                                            onChange={(e) => setUsernameInput(e.target.value)}
                                            placeholder="Enter Username..."
                                            className="w-full p-3 stardew-box rounded-xl text-center font-bold focus:outline-none focus:ring-4 focus:ring-pink-400"
                                        />
                                        <button type="submit" className="w-full py-3 bg-pink-500 border-4 border-pink-300 text-slate-950 font-bold rounded-xl hover:bg-pink-400 transition shadow-md">
                                            Start Playing
                                        </button>
                                    </form>
                                ) : (
                                    <div className="p-6 stardew-card rounded-2xl space-y-6">
                                        <div className="flex items-center justify-between border-b-2 border-pink-900 pb-4">
                                            <div>
                                                <h3 className="text-lg font-bold text-pink-300">{user.username}</h3>
                                                <div className="flex items-center space-x-2 text-xs text-sky-300">
                                                    <span>{getRankInfo(user.total_aura).icon} {getRankInfo(user.total_aura).title}</span>
                                                    <span>•</span>
                                                    <span>{user.total_aura} Aura</span>
                                                </div>
                                            </div>
                                            <Mascot state={evaluating ? 'thinking' : 'idle'} />
                                        </div>

                                        <div className="p-4 bg-slate-950/80 border-2 border-slate-800 rounded-xl space-y-1">
                                            <span className="text-xs font-bold text-pink-400 uppercase tracking-wider">Rewrite in Gen Z Slang:</span>
                                            <p className="text-base text-sky-100 font-medium">"{PROMPTS[currentPromptIndex]}"</p>
                                        </div>

                                        <textarea
                                            value={gameInput}
                                            onChange={(e) => setGameInput(e.target.value)}
                                            placeholder="Type your slang version..."
                                            className="w-full h-28 p-4 stardew-box rounded-xl font-semibold focus:outline-none focus:ring-4 focus:ring-pink-400"
                                        />

                                        <button
                                            onClick={evaluateGameSubmission}
                                            disabled={evaluating}
                                            className="w-full py-3 bg-pink-500 border-4 border-pink-300 font-bold text-slate-950 rounded-xl hover:bg-pink-400 transition shadow-md disabled:opacity-50"
                                        >
                                            {evaluating ? "Evaluating Aura..." : "Submit Answer 🚀"}
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* LEADERBOARD TAB */}
                        {activeTab === 'leaderboard' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-pink-300 text-center drop-shadow-[0_2px_0_#000]">Global Aura Leaderboard</h2>
                                <div className="p-4 stardew-card rounded-2xl space-y-3">
                                    {leaderboard.map((player, index) => {
                                        const rank = getRankInfo(player.total_aura);
                                        return (
                                            <div key={player.id} className="flex items-center justify-between p-3 bg-slate-950/80 rounded-xl border-2 border-slate-800">
                                                <div className="flex items-center space-x-3">
                                                    <span className={`font-black text-lg ${index === 0 ? 'text-pink-400' : index === 1 ? 'text-sky-300' : index === 2 ? 'text-purple-400' : 'text-slate-500'}`}>
                                                        #{index + 1}
                                                    </span>
                                                    <div>
                                                        <div className="font-bold text-sky-100">{player.username}</div>
                                                        <div className="text-xs text-pink-400">{rank.icon} {rank.title}</div>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-bold text-pink-300">{player.total_aura} Aura</div>
                                                    <div className="text-xs text-sky-300/60">{player.games_played} Games Played</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* EVALUATION MODAL */}
                    {scoreModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="stardew-card p-6 rounded-2xl max-w-md w-full space-y-4 text-center">
                                <h3 className="text-2xl font-extrabold text-pink-300">Aura Evaluation</h3>
                                <div className="text-4xl font-black text-sky-400 drop-shadow-[0_2px_0_#000]">+{scoreModal.overall} Aura</div>
                                <p className="text-sm text-sky-100 font-medium">"{scoreModal.feedback}"</p>
                                
                                <div className="grid grid-cols-2 gap-2 text-xs py-2">
                                    <div className="p-2 bg-slate-950 rounded-lg border-2 border-slate-800">
                                        <div className="text-sky-300/80">Slang Level</div>
                                        <div className="font-bold text-pink-300">{scoreModal.slangScore}%</div>
                                    </div>
                                    <div className="p-2 bg-slate-950 rounded-lg border-2 border-slate-800">
                                        <div className="text-sky-300/80">Creativity</div>
                                        <div className="font-bold text-sky-400">{scoreModal.creativity}%</div>
                                    </div>
                                </div>

                                <button
                                    onClick={nextPrompt}
                                    className="w-full py-3 bg-pink-500 border-4 border-pink-300 text-slate-950 font-bold rounded-xl hover:bg-pink-400 transition shadow-md"
                                >
                                    Next Challenge 🚀
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
