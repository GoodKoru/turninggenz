    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.FramerMotion || window.Motion || {};

        class PixelAudioEngine {
            constructor() { this.ctx = null; this.bgmTimer = null; this.isPlayingBgm = false; this.currentMenu = 'home'; this.noteIndex = 0; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playBlip(freq = 440, type = 'square', duration = 0.08) {
                try {
                    this.init(); if (!this.ctx) return;
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playPop() { this.playBlip(600, 'sine', 0.05); setTimeout(() => this.playBlip(880, 'sine', 0.08), 50); }
            playFanfare() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => this.playBlip(f, 'square', 0.15), i * 100)); }
            
            playGoofyTranslateSound() {
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.15);
                osc.frequency.linearRampToValueAtTime(200, now + 0.3);
                osc.frequency.linearRampToValueAtTime(1000, now + 0.45);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.5);
            }

            playLaserSound() {
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.15);
            }

            setMenuTheme(menu) {
                this.currentMenu = menu;
                this.noteIndex = 0;
            }

            toggleBGM(cb) {
                this.init();
                if (this.isPlayingBgm) { clearInterval(this.bgmTimer); this.isPlayingBgm = false; if (cb) cb(false); return; }
                this.isPlayingBgm = true; if (cb) cb(true);

                const melodies = {
                    home: [659.25, 659.25, 659.25, 523.25, 659.25, 783.99, 392.00],
                    translator: [300, 400, 350, 500, 250, 600, 150, 450],
                    auracheck: [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77],
                    arcade: [800, 400, 800, 300, 900, 200, 1000, 500],
                    arena: [220, 246.94, 261.63, 293.66, 329.63, 349.23],
                    leaderboard: [440, 554.37, 659.25, 880, 659.25, 554.37]
                };

                this.bgmTimer = setInterval(() => {
                    if (!this.isPlayingBgm || !this.ctx) return;
                    const melody = melodies[this.currentMenu] || melodies.home;
                    const freq = melody[this.noteIndex % melody.length];
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = this.currentMenu === 'arcade' ? 'sawtooth' : this.currentMenu === 'translator' ? 'square' : 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.12);
                    this.noteIndex++;
                }, 140);
            }
        }

            return (
                <div className="retro-card p-6 rounded-xl space-y-6">
                    <div className="text-center space-y-2">
                        <h2 className="text-xs md:text-sm pixel-font text-yellow-300 flex items-center justify-center gap-2"><PixelUfoIcon /> AURA SCANNER GAME <PixelUfoIcon /></h2>
                        <p className="text-[8px] text-gray-300">Answer scenario questions to scan your cosmic aura level!</p>
                    </div>
                    <div className="space-y-4">
                        {questions.map((q) => (
                            <div key={q.id} className="p-3 bg-[#001a33] border-2 border-white rounded space-y-2">
                                <p className="text-[9px] text-yellow-200 pixel-font">{q.id}. {q.text}</p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    {q.opts.map((opt, idx) => (
                                        <button key={idx} onClick={() => handleSelect(q.id, opt.aura)} className={`p-2 text-left text-[8px] border rounded transition ${selectedAnswers[q.id] === opt.aura ? 'bg-pink-600 border-yellow-300 text-white font-bold' : 'bg-[#002244] border-gray-600 text-gray-300 hover:bg-[#003366]'}`}>
                                            {opt.text}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    <button onClick={calculateAuraScore} disabled={Object.keys(selectedAnswers).length < questions.length} className="w-full py-3 bg-yellow-400 border-2 border-white text-black font-bold pixel-font text-[10px] hover:bg-yellow-300 transition shadow-[0_4px_0_#000] disabled:opacity-40">
                        ANALYZE COSMIC AURA ✨
                    </button>
                    {calculatedAura !== null && (
                        <motion.div initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="p-4 retro-box rounded text-center space-y-3">
                            <div className="text-[9px] pixel-font text-pink-400">YOUR SCANNED AURA:</div>
                            <div className="text-2xl pixel-font text-green-400">{calculatedAura} AURA</div>
                            
                            <div className="py-2">
                                <CatMemeIcon type={calculatedAura > 1200 ? 'chad' : calculatedAura > 700 ? 'happy' : 'cry'} />
                            </div>

                            <p className="text-[8px] text-gray-200">
                                {calculatedAura > 1200 
                                    ? "GIGACHAD CAT APPROVED! UNSTOPPABLE COSMIC ENERGY!" 
                                    : calculatedAura > 700 
                                    ? "HAPPY CAT VIBES! Solid respectable aura energy!" 
                                    : "CRYING CAT STATUS... Massive L aura, keep grinding!"}
                            </p>
                        </motion.div>
                    )}
                </div>
            );
        };

        const InteractivePopGame = () => {
            const [score, setScore] = useState(0);
            const [pods, setPods] = useState([]);
            const [lasers, setLasers] = useState([]);
            const containerRef = useRef(null);

            useEffect(() => {
                const interval = setInterval(() => {
                    const id = Date.now() + Math.random();
                    const word = TARGET_WORDS[Math.floor(Math.random() * TARGET_WORDS.length)];
                    const x = Math.random() * 75 + 10;
                    setPods(prev => [...prev.slice(-6), { id, word, x }]);
                }, 1200);
                return () => clearInterval(interval);
            }, []);

            const handleContainerClick = (e) => {
                if (!containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                audioEngine.playLaserSound();
                const laserId = Date.now() + Math.random();
                setLasers(prev => [...prev, { id: laserId, x: clickX, y: clickY }]);
                setTimeout(() => {
                    setLasers(prev => prev.filter(l => l.id !== laserId));
                }, 200);
            };

            const popPod = (e, id) => {
                e.stopPropagation();
                audioEngine.playPop();
                setScore(s => s + 10);
                setPods(prev => prev.filter(t => t.id !== id));
                if (window.confetti) window.confetti({ particleCount: 20, spread: 40 });
            };

            return (
                <div 
                    ref={containerRef}
                    onClick={handleContainerClick}
                    className="relative w-full h-80 game-pixel-bg rounded-xl border-4 border-white p-4 flex flex-col justify-between shadow-[0_0_0_4px_#000] cursor-crosshair overflow-hidden"
                >
                    {lasers.map(l => (
                        <svg key={l.id} className="absolute inset-0 pointer-events-none w-full h-full z-20">
                            <line x1="50%" y1="100%" x2={l.x} y2={l.y} stroke="#ff0055" strokeWidth="4" />
                            <circle cx={l.x} cy={l.y} r="8" fill="#ffff00" />
                        </svg>
                    ))}

                    <div className="flex justify-between items-center z-10 bg-[#001a33] p-2 border-2 border-yellow-400">
                        <span className="pixel-font text-[9px] text-yellow-300 flex items-center gap-1"><PixelSpaceshipIcon /> LASER ARCADE</span>
                        <span className="pixel-font text-[9px] text-green-400">SCORE: {score}</span>
                    </div>
                    
                    <div className="relative flex-1 w-full mt-2">
                        <AnimatePresence>
                            {pods.map(pod => (
                                <motion.div key={pod.id} initial={{ y: 200, opacity: 1, scale: 0.8 }} animate={{ y: -40, opacity: 1, scale: 1 }} exit={{ scale: 0, opacity: 0 }} transition={{ duration: 3.2, ease: "linear" }} onClick={(e) => popPod(e, pod.id)} style={{ left: `${pod.x}%` }} className="absolute cursor-pointer select-none bg-[#ff3399] border-2 border-white p-2 rounded text-center shadow-[0_4px_0_#000] hover:scale-110 active:scale-90 z-10">
                                    <PixelUfoIcon />
                                    <div className="pixel-font text-[8px] text-white font-bold mt-1">{pod.word}</div>
                                </motion.div>
                            ))}
                        </AnimatePresence>
                    </div>
                    <p className="text-center text-[8px] pixel-font text-yellow-300 z-10 bg-[#001a33] py-2 border-2 border-white">Click anywhere to blast LASERS and pop Space Pods!</p>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [selectedStyle, setSelectedStyle] = useState('genz');
            const [inputText, setInputText] = useState('');
            const [translatedText, setTranslatedText] = useState('');
            const [history, setHistory] = useState([]);
            const [mascotState, setMascotState] = useState('idle');
            const [isAudioPlaying, setIsAudioPlaying] = useState(false);

            const [user, setUser] = useState(null);
            const [usernameInput, setUsernameInput] = useState('');
            const [currentPromptIndex, setCurrentPromptIndex] = useState(0);
            const [gameInput, setGameInput] = useState('');
            const [evaluating, setEvaluating] = useState(false);
            const [scoreModal, setScoreModal] = useState(null);
            const [leaderboard, setLeaderboard] = useState([]);

            useEffect(() => {
                const savedLB = JSON.parse(localStorage.getItem('vibelingo_lb') || '[]');
                if (!savedLB.length) {
                    const mockLB = [
                        { id: 1, username: 'RizzGod99', total_aura: 1850, highest_score: 98, games_played: 20, badges: ['GigaChad Supreme'] },
                        { id: 2, username: 'SkibidiKing', total_aura: 1120, highest_score: 92, games_played: 14, badges: ['Aura Master'] },
                        { id: 3, username: 'GyattWatcher', total_aura: 640, highest_score: 85, games_played: 8, badges: ['Aura Apprentice'] }
                    ];
                    setLeaderboard(mockLB);
                    localStorage.setItem('vibelingo_lb', JSON.stringify(mockLB));
                } else {
                    setLeaderboard(savedLB);
                }
            }, []);

            const switchTab = (tab) => {
                audioEngine.playPop();
                setActiveTab(tab);
                audioEngine.setMenuTheme(tab);
            };

            const toggleMusic = () => audioEngine.toggleBGM(setIsAudioPlaying);

            const handleTranslate = () => {
                if (!inputText.trim()) return;
                audioEngine.playGoofyTranslateSound();
                setMascotState('thinking');

                setTimeout(() => {
                    let result = "";
                    const words = inputText.split(/\s+/);
                    if (selectedStyle === 'genz') {
                        result = words.map(w => {
                            const clean = w.toLowerCase().replace(/[^\w]/g, "");
                            return GENZ_DICT[clean] ? w.toLowerCase().replace(clean, GENZ_DICT[clean]) : w;
                        }).join(" ") + SUFFIXES[Math.floor(Math.random() * SUFFIXES.length)];
                    } else if (selectedStyle === 'reverse') {
                        result = words.map(w => {
                            const clean = w.toLowerCase().replace(/[^\w]/g, "");
                            return REVERSE_DICT[clean] ? w.toLowerCase().replace(clean, REVERSE_DICT[clean]) : w;
                        }).join(" ");
                    } else if (selectedStyle === 'shakespeare') {
                        result = "Hark! " + words.map(w => w + "eth").join(" ") + ", verily fine star-farer.";
                    } else if (selectedStyle === 'british') {
                        result = "Allow it fam, " + words.join(" ") + " is proper mad innit, bruv.";
                    } else if (selectedStyle === 'pirate') {
                        result = "Ahoy cosmic captain! " + words.join(" ") + " by order of the galaxy!";
                    }

                    setTranslatedText(result);
                    setHistory(prev => [{ id: Date.now(), original: inputText, translated: result, style: selectedStyle }, ...prev.slice(0, 4)]);
                    setMascotState('celebrate');
                    audioEngine.playFanfare();
                    setTimeout(() => setMascotState('idle'), 2000);
                }, 400);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!usernameInput.trim()) return;
                audioEngine.playPop();
                const existing = leaderboard.find(u => u.username.toLowerCase() === usernameInput.trim().toLowerCase());
                setUser(existing || { id: Date.now(), username: usernameInput.trim(), total_aura: 0, highest_score: 0, games_played: 0, badges: [] });
            };

            const evaluateGameSubmission = () => {
                if (!gameInput.trim()) return;
                setEvaluating(true); setMascotState('thinking');
                setTimeout(() => {
                    const wordCount = gameInput.trim().split(/\s+/).length;
                    const slangMatches = Object.values(GENZ_DICT).filter(slang => gameInput.toLowerCase().includes(slang)).length;
                    const slangScore = Math.min(100, slangMatches * 30 + 20);
                    const naturalness = wordCount >= 4 && slangMatches <= 3 ? 88 : 55;
                    const meaning = 82, creativity = Math.min(100, 45 + slangMatches * 15);
                    const overall = Math.round((slangScore + naturalness + meaning + creativity) / 4);

                    const updatedUser = { ...user, total_aura: user.total_aura + overall, highest_score: Math.max(user.highest_score, overall), games_played: user.games_played + 1 };
                    setUser(updatedUser);

                    const newLB = leaderboard.map(u => u.id === updatedUser.id ? updatedUser : u);
                    if (!newLB.some(u => u.id === updatedUser.id)) newLB.push(updatedUser);
                    newLB.sort((a, b) => b.total_aura - a.total_aura);

                    setLeaderboard(newLB);
                    localStorage.setItem('vibelingo_lb', JSON.stringify(newLB));
                    setScoreModal({ overall, meaning, slangScore, naturalness, creativity, feedback: overall > 75 ? "W submission fr fr, you locked in!" : "Kind of mid, needs more brainrot energy." });
                    setEvaluating(false);

                    if (overall >= 70) {
                        setMascotState('celebrate'); audioEngine.playFanfare();
                        if (window.confetti) window.confetti({ particleCount: 100, spread: 70 });
                    } else { setMascotState('sad'); }
                }, 1000);
            };

            return (
                <div className="min-h-screen flex flex-col relative overflow-hidden">
                    <PixelNyanBackground menuTab={activeTab} />
                    <nav className="border-b-4 border-white bg-[#001a33] sticky top-0 z-50 px-4 py-3 flex items-center justify-between shadow-[0_4px_0_#000]">
                        <div className="flex items-center space-x-2 cursor-pointer" onClick={() => switchTab('home')}>
                            <PixelSpaceshipIcon /><span className="pixel-font font-bold text-[11px] md:text-sm text-yellow-300 drop-shadow-[0_2px_0_#000]">Vibelingo</span>
                        </div>
                        <div className="flex items-center space-x-1 md:space-x-2 overflow-x-auto">
                            {['home', 'translator', 'auracheck', 'arcade', 'arena', 'leaderboard'].map(tab => (
                                <button key={tab} onClick={() => switchTab(tab)} className={`px-2 py-1 md:px-3 md:py-2 text-[7px] md:text-[9px] pixel-font uppercase border-2 ${activeTab === tab ? 'bg-yellow-400 text-black border-white shadow-[0_2px_0_#000] font-bold' : 'bg-[#002244] text-white border-black hover:bg-[#003366]'} transition-colors`}>
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </nav>

                    <div className="flex-1 w-full max-w-4xl mx-auto p-4 md:p-8 z-10 space-y-6">
                        {activeTab === 'home' && (
                            <div className="space-y-8 text-center mt-4">
                                <motion.div initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} transition={{ type: 'spring', bounce: 0.5 }}>
                                    <h1 className="text-3xl md:text-5xl pixel-font text-white drop-shadow-[0_4px_0_#000] mb-4">
                                        Translate the <span className="text-pink-400">Vibe</span>
                                    </h1>
                                    <p className="text-[10px] md:text-xs text-gray-300 max-w-lg mx-auto leading-relaxed pixel-font">
                                        The universal translator for internet slang, Gen Z brainrot, and beyond. Speak fluent internet.
                                    </p>
                                </motion.div>
                                <div className="mt-8">
                                    <Mascot state="celebrate" />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">
                                    <button onClick={() => switchTab('translator')} className="retro-card p-6 rounded-xl hover:bg-[#002244] transition group">
                                        <div className="text-xl text-yellow-300 mb-2"><PixelSpaceshipIcon /> Translator</div>
                                        <div className="text-[8px] text-gray-300 group-hover:text-white transition">Decode the timeline. Translate normal text to brainrot or vice versa.</div>
                                    </button>
                                    <button onClick={() => switchTab('auracheck')} className="retro-card p-6 rounded-xl hover:bg-[#002244] transition group">
                                        <div className="text-xl text-cyan-300 mb-2"><PixelAlienIcon /> Aura Check</div>
                                        <div className="text-[8px] text-gray-300 group-hover:text-white transition">Are you goated or an NPC? Take the quiz to find your cosmic aura score.</div>
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'translator' && (
                            <div className="space-y-6">
                                <div className="text-center mb-6">
                                    <h2 className="text-xl md:text-2xl pixel-font text-yellow-300 drop-shadow-[0_2px_0_#000]">Slang Translator</h2>
                                    <p className="text-[9px] text-gray-300 mt-2">Select your dialect and start typing</p>
                                </div>
                                
                                <div className="flex flex-wrap gap-2 justify-center mb-6">
                                    {STYLES.map(style => (
                                        <button key={style.id} onClick={() => { setSelectedStyle(style.id); audioEngine.playPop(); }} className={`flex items-center gap-2 px-3 py-2 text-[8px] md:text-[9px] pixel-font border-2 transition ${selectedStyle === style.id ? 'bg-pink-500 border-white text-white shadow-[0_2px_0_#000]' : 'bg-[#001a33] border-gray-600 text-gray-400 hover:border-gray-400 hover:text-white'}`}>
                                            {style.icon} {style.name}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
                                    <div className="retro-card p-4 rounded-xl flex flex-col h-[280px]">
                                        <div className="text-[10px] pixel-font text-gray-400 mb-2 border-b-2 border-gray-600 pb-2">INPUT</div>
                                        <textarea 
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            placeholder="Type something basic here..."
                                            className="flex-1 bg-transparent text-white pixel-font text-[10px] md:text-xs resize-none outline-none leading-loose placeholder-gray-600"
                                            spellCheck={false}
                                        />
                                        <button 
                                            onClick={handleTranslate} 
                                            disabled={!inputText.trim() || mascotState === 'thinking'}
                                            className="mt-2 w-full py-3 bg-cyan-400 text-black border-2 border-white pixel-font text-[10px] font-bold hover:bg-cyan-300 active:translate-y-1 active:shadow-none shadow-[0_4px_0_#000] transition disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            {mascotState === 'thinking' ? 'PROCESSING...' : 'TRANSLATE'}
                                        </button>
                                    </div>
                                    
                                    <div className="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-12 h-12 bg-[#001a33] border-4 border-white rounded-full items-center justify-center text-yellow-300 animate-pulse">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                    </div>

                                    <div className="retro-card p-4 rounded-xl flex flex-col h-[280px] bg-[#001f3f]">
                                        <div className="text-[10px] pixel-font text-pink-400 mb-2 border-b-2 border-pink-900 pb-2 flex justify-between">
                                            <span>OUTPUT</span>
                                            <span>{STYLES.find(s=>s.id===selectedStyle)?.name.toUpperCase()}</span>
                                        </div>
                                        <div className="flex-1 overflow-y-auto pixel-font text-[10px] md:text-xs text-green-300 leading-loose break-words whitespace-pre-wrap">
                                            {translatedText || <span className="text-gray-600">Awaiting transmission...</span>}
                                        </div>
                                        <div className="mt-2 flex justify-end">
                                            <button 
                                                onClick={() => { navigator.clipboard.writeText(translatedText); audioEngine.playPop(); }} 
                                                disabled={!translatedText}
                                                className="px-3 py-2 bg-[#002244] border-2 border-gray-500 text-[8px] text-white hover:border-white disabled:opacity-30"
                                            >
                                                COPY TO CLIPBOARD
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {history.length > 0 && (
                                    <div className="mt-8">
                                        <h3 className="text-[10px] pixel-font text-gray-400 mb-4">RECENT TRANSLATIONS</h3>
                                        <div className="space-y-2">
                                            {history.map(item => (
                                                <div key={item.id} className="p-3 bg-[#001a33] border-l-4 border-cyan-400 flex flex-col md:flex-row md:items-center gap-2 md:gap-4 text-[9px] pixel-font">
                                                    <div className="text-gray-400 flex-1 truncate">{item.original}</div>
                                                    <div className="hidden md:block text-gray-600">→</div>
                                                    <div className="text-green-300 flex-1 truncate">{item.translated}</div>
                                                    <div className="text-[7px] bg-[#002244] px-2 py-1 rounded text-gray-400 uppercase border border-gray-600">{item.style}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'auracheck' && (
                            <div className="max-w-2xl mx-auto">
                                <AuraCheckerGame />
                            </div>
                        )}

                        {activeTab === 'arcade' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <div className="text-center mb-6">
                                    <h2 className="text-xl md:text-2xl pixel-font text-pink-400 drop-shadow-[0_2px_0_#000]">Slang Arcade</h2>
                                    <p className="text-[9px] text-gray-300 mt-2">Pop the pods containing Gen Z slang words before they escape!</p>
                                </div>
                                <InteractivePopGame />
                            </div>
                        )}

                        {activeTab === 'arena' && (
                            <div className="max-w-2xl mx-auto space-y-6">
                                <div className="text-center mb-6">
                                    <h2 className="text-xl md:text-2xl pixel-font text-orange-400 drop-shadow-[0_2px_0_#000]">Vibe Arena</h2>
                                    <p className="text-[9px] text-gray-300 mt-2">Translate basic sentences into peak internet slang to earn Aura.</p>
                                </div>

                                {!user ? (
                                    <form onSubmit={handleLogin} className="retro-card p-6 rounded-xl space-y-4 max-w-sm mx-auto">
                                        <div className="text-[10px] pixel-font text-yellow-300 mb-2 text-center">ENTER USERNAME</div>
                                        <input 
                                            type="text" 
                                            value={usernameInput} 
                                            onChange={(e) => setUsernameInput(e.target.value)} 
                                            className="w-full bg-[#001a33] border-2 border-white text-white p-2 pixel-font text-[10px] outline-none text-center"
                                            maxLength={12}
                                            placeholder="e.g. Rizzler99"
                                        />
                                        <button type="submit" className="w-full py-2 bg-green-400 border-2 border-white text-black pixel-font text-[10px] font-bold shadow-[0_4px_0_#000] hover:bg-green-300 active:translate-y-1 active:shadow-none transition">
                                            JOIN ARENA
                                        </button>
                                    </form>
                                ) : (
                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center bg-[#001a33] p-3 border-2 border-white rounded">
                                            <div className="pixel-font text-[9px] text-white flex items-center gap-2">
                                                <PixelAlienIcon /> {user.username}
                                            </div>
                                            <div className="pixel-font text-[9px] text-yellow-300">
                                                TOTAL AURA: {user.total_aura}
                                            </div>
                                        </div>

                                        <div className="retro-card p-6 rounded-xl space-y-4">
                                            <div className="text-[9px] pixel-font text-gray-400">CHALLENGE {currentPromptIndex + 1}/{PROMPTS.length}</div>
                                            <div className="text-sm md:text-base pixel-font text-white bg-[#001a33] p-4 border-2 border-gray-600 rounded leading-loose">
                                                "{PROMPTS[currentPromptIndex]}"
                                            </div>
                                            
                                            <div className="text-[8px] pixel-font text-pink-400">YOUR TRANSLATION:</div>
                                            <textarea 
                                                value={gameInput}
                                                onChange={(e) => setGameInput(e.target.value)}
                                                className="w-full h-24 bg-[#001a33] border-2 border-white text-white p-3 pixel-font text-[10px] outline-none resize-none placeholder-gray-600 leading-loose"
                                                placeholder="Type your brainrot translation here..."
                                            />
                                            
                                            <button 
                                                onClick={evaluateGameSubmission}
                                                disabled={evaluating || !gameInput.trim()}
                                                className="w-full py-3 bg-yellow-400 border-2 border-white text-black pixel-font text-[10px] font-bold shadow-[0_4px_0_#000] hover:bg-yellow-300 disabled:opacity-50 transition"
                                            >
                                                {evaluating ? 'ANALYZING VIBES...' : 'SUBMIT TRANSLATION'}
                                            </button>
                                        </div>

                                        {scoreModal && (
                                            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                                                <div className="retro-card p-6 rounded-xl max-w-md w-full bg-[#001f3f] space-y-6">
                                                    <div className="text-center text-xl pixel-font text-white">SCORECARD</div>
                                                    
                                                    <div className="text-center text-4xl pixel-font text-yellow-300 animate-pulse">
                                                        {scoreModal.overall}
                                                    </div>
                                                    
                                                    <div className="space-y-3 bg-[#001a33] p-4 border-2 border-gray-600">
                                                        <div className="flex justify-between text-[9px] pixel-font text-gray-300">
                                                            <span>Slang Usage:</span>
                                                            <span className="text-pink-400">{scoreModal.slangScore}/100</span>
                                                        </div>
                                                        <div className="flex justify-between text-[9px] pixel-font text-gray-300">
                                                            <span>Natural Flow:</span>
                                                            <span className="text-cyan-400">{scoreModal.naturalness}/100</span>
                                                        </div>
                                                        <div className="flex justify-between text-[9px] pixel-font text-gray-300">
                                                            <span>Creativity:</span>
                                                            <span className="text-green-400">{scoreModal.creativity}/100</span>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="text-center text-[10px] pixel-font text-white leading-loose bg-[#003366] p-3 border-2 border-white">
                                                        "{scoreModal.feedback}"
                                                    </div>
                                                    
                                                    <button 
                                                        onClick={() => {
                                                            setScoreModal(null);
                                                            setGameInput('');
                                                            setCurrentPromptIndex((prev) => (prev + 1) % PROMPTS.length);
                                                            setMascotState('idle');
                                                            audioEngine.playPop();
                                                        }}
                                                        className="w-full py-3 bg-white text-black border-2 border-gray-400 pixel-font text-[10px] font-bold hover:bg-gray-200"
                                                    >
                                                        NEXT CHALLENGE
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'leaderboard' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <div className="text-center mb-6">
                                    <h2 className="text-xl md:text-2xl pixel-font text-yellow-300 drop-shadow-[0_2px_0_#000]">Global Leaderboard</h2>
                                    <p className="text-[9px] text-gray-300 mt-2">The highest Aura holders in the galaxy</p>
                                </div>
                                
                                <div className="retro-card overflow-hidden rounded-xl bg-[#001f3f]">
                                    <div className="grid grid-cols-12 gap-2 bg-[#001a33] p-4 border-b-2 border-white text-[8px] md:text-[9px] pixel-font text-gray-400">
                                        <div className="col-span-1 text-center">#</div>
                                        <div className="col-span-5">USERNAME</div>
                                        <div className="col-span-3 text-right">TOTAL AURA</div>
                                        <div className="col-span-3 text-right">HIGH SCORE</div>
                                    </div>
                                    
                                    <div className="divide-y divide-gray-700">
                                        {leaderboard.map((player, idx) => {
                                            const rank = getRankInfo(player.total_aura);
                                            return (
                                                <div key={player.id} className={`grid grid-cols-12 gap-2 p-4 items-center text-[9px] md:text-[10px] pixel-font ${idx === 0 ? 'bg-yellow-900/30' : idx === 1 ? 'bg-gray-700/30' : idx === 2 ? 'bg-orange-900/30' : 'hover:bg-[#002244]'}`}>
                                                    <div className={`col-span-1 text-center ${idx === 0 ? 'text-yellow-300' : idx === 1 ? 'text-gray-300' : idx === 2 ? 'text-orange-400' : 'text-gray-500'}`}>
                                                        {idx + 1}
                                                    </div>
                                                    <div className="col-span-5 flex flex-col md:flex-row md:items-center gap-1 md:gap-2 truncate">
                                                        <span className="text-white truncate">{player.username}</span>
                                                        <span className={`text-[6px] md:text-[7px] px-1 py-0.5 border rounded ${rank.color} border-current w-max whitespace-nowrap`}>
                                                            {rank.title}
                                                        </span>
                                                    </div>
                                                    <div className="col-span-3 text-right text-yellow-300">
                                                        {player.total_aura}
                                                    </div>
                                                    <div className="col-span-3 text-right text-green-400">
                                                        {player.highest_score}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    <button 
                        onClick={toggleMusic}
                        className="fixed bottom-4 right-4 z-50 w-10 h-10 bg-[#001a33] border-2 border-white rounded-full flex items-center justify-center text-white hover:bg-[#002244] shadow-[0_2px_0_#000] active:translate-y-1 active:shadow-none transition"
                        title="Toggle Music"
                    >
                        {isAudioPlaying ? (
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        ) : (
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                        )}
                    </button>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
