<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyan Slang Lab & Space Games</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            /* Cosmic Deep Night Sky Background */
            background-color: #030712;
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(30, 27, 75, 0.6) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(15, 23, 42, 0.8) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, #030712 0%, #020617 100%);
            color: #f9fafb;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* Dark Cosmic UI Panel Framing */
        .cosmic-card {
            background-color: rgba(15, 23, 42, 0.9);
            border: 3px solid #38bdf8;
            box-shadow: 
                inset 0 0 0 2px #1e293b,
                0 0 20px rgba(56, 189, 248, 0.2),
                0 8px 16px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
        }

        .cosmic-box {
            background-color: #0f172a;
            border: 2px solid #38bdf8;
            color: #e2e8f0;
        }

        /* Pixel Game Board Styling */
        .game-pixel-bg {
            background-color: #090d16;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.FramerMotion || window.Motion;

        // --- CONSTANTS & MAPPINGS ---
        const STYLES = [
            { id: 'genz', name: 'Gen Z / Brainrot', icon: '💀', desc: 'Maximum bussin brainrot vibes' },
            { id: 'reverse', name: 'Brainrot -> Normal', icon: '🧹', desc: 'Translate slang back to plain English' },
            { id: 'shakespeare', name: 'Shakespearean', icon: '📜', desc: 'Verily, thou art goated' },
            { id: 'british', name: 'British Roadman', icon: '☕', desc: 'Allow it fam, bare vibes' },
            { id: 'pirate', name: 'Pirate', icon: '🏴‍☠️', desc: 'Ahoy matey, ye got rizz' },
            { id: 'formal', name: 'Overly Formal', icon: '🎩', desc: 'Extremely sophisticated prose' }
        ];

        const GENZ_DICT = {
            "hello": "yo chat", "friend": "blud", "friends": "the squad", "good": "bussin",
            "great": "w", "cool": "sigma", "bad": "L", "lie": "cap", "truth": "no cap",
            "yes": "fr fr", "very": "mad", "crazy": "unhinged", "attractive": "rizzler",
            "charisma": "rizz", "steal": "fanum tax", "stole": "fanum taxed", "food": "gyatt food",
            "fool": "skibidi NPC", "weird": "sus", "best": "goated", "defeated": "cooked",
            "focused": "locked in", "money": "mewing funds", "bro": "chat"
        };

        const SUFFIXES = [" fr fr", " no cap", " in Ohio", " lowkey", " (real)", " skibidi style"];

        const PROMPTS = [
            "I am currently focusing very hard on completing my homework.",
            "My friend stole my food while I was not looking.",
            "That new video game is extremely good and impressive.",
            "He tried to look stylish, but he embarrassed himself in public.",
            "I am telling you the truth, I won the competition fairly."
        ];

        // Cosmic Target Slang Words for Mini-Game
        const TARGET_WORDS = ["RIZZ", "GYATT", "BUSSIN", "SIGMA", "SKIBIDI", "NO CAP", "GOATED", "COOKED"];

        // --- NIGHT SKY STARS & FLOATING PLANETS COMPONENT ---
        const CosmicBackground = () => {
            const stars = Array.from({ length: 45 });
            
            const planets = [
                { id: 1, size: 64, color: 'from-blue-600 via-indigo-700 to-slate-900', ring: true, top: '12%', left: '8%', duration: 22, delay: 0 },
                { id: 2, size: 48, color: 'from-violet-600 via-purple-900 to-slate-950', ring: false, top: '65%', left: '82%', duration: 18, delay: 2 },
                { id: 3, size: 36, color: 'from-amber-600 via-orange-800 to-slate-950', ring: true, top: '25%', left: '85%', duration: 26, delay: 4 },
                { id: 4, size: 28, color: 'from-emerald-500 via-teal-800 to-slate-950', ring: false, top: '75%', left: '12%', duration: 20, delay: 1 }
            ];

            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                    {/* Twinkling Stars */}
                    {stars.map((_, i) => {
                        const top = Math.random() * 100;
                        const left = Math.random() * 100;
                        const duration = 1.5 + Math.random() * 2.5;
                        return (
                            <motion.div
                                key={`star-${i}`}
                                className="absolute bg-white rounded-full"
                                style={{
                                    top: `${top}%`,
                                    left: `${left}%`,
                                    width: i % 4 === 0 ? '4px' : '2px',
                                    height: i % 4 === 0 ? '4px' : '2px',
                                    boxShadow: i % 4 === 0 ? '0 0 8px #ffffff' : '0 0 4px #38bdf8'
                                }}
                                animate={{
                                    opacity: [0.15, 0.95, 0.15],
                                    scale: [0.8, 1.25, 0.8]
                                }}
                                transition={{
                                    duration: duration,
                                    repeat: Infinity,
                                    ease: "easeInOut"
                                }}
                            />
                        );
                    })}

                    {/* Floating Cosmic Planets */}
                    {planets.map(p => (
                        <motion.div
                            key={`planet-${p.id}`}
                            className="absolute rounded-full shadow-2xl flex items-center justify-center"
                            style={{
                                width: `${p.size}px`,
                                height: `${p.size}px`,
                                top: p.top,
                                left: p.left
                            }}
                            animate={{
                                y: [0, -18, 0],
                                rotate: [0, 360]
                            }}
                            transition={{
                                y: { duration: p.duration / 3, repeat: Infinity, ease: "easeInOut", delay: p.delay },
                                rotate: { duration: p.duration * 2, repeat: Infinity, ease: "linear" }
                            }}
                        >
                            <div className={`w-full h-full rounded-full bg-gradient-to-br ${p.color} border border-slate-700/50 shadow-[inset_-6px_-6px_12px_rgba(0,0,0,0.8)] relative`}>
                                {p.ring && (
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[160%] h-[35%] border-2 border-sky-400/40 rounded-[100%] rotate-[-25deg] pointer-events-none" />
                                )}
                            </div>
                        </motion.div>
                    ))}
                </div>
            );
        };

        // --- AURA RANK SYSTEM ---
        const getRankInfo = (aura) => {
            if (aura >= 1500) return { title: 'GigaChad Supreme', color: 'from-amber-400 to-sky-400', icon: '👑' };
            if (aura >= 1000) return { title: 'Aura Master', color: 'from-sky-400 to-indigo-400', icon: '🔮' };
            if (aura >= 750) return { title: 'Valid', color: 'from-cyan-400 to-blue-400', icon: '⚡' };
            if (aura >= 500) return { title: 'Aura Apprentice', color: 'from-blue-300 to-indigo-400', icon: '✨' };
            if (aura >= 250) return { title: 'Certified', color: 'from-sky-300 to-blue-500', icon: '🎖️' };
            if (aura >= 100) return { title: 'Side Character', color: 'from-slate-400 to-slate-200', icon: '👤' };
            return { title: 'NPC', color: 'from-slate-600 to-slate-400', icon: '🤖' };
        };

        // --- MASCOT COMPONENT WITH INTERACTIVE FACE TAP ---
        const Mascot = ({ state, onClick }) => {
            const [tapFaceIndex, setTapFaceIndex] = useState(0);

            const faces = ['default', 'derp', 'glasses', 'cool', 'surprised'];

            const handleTap = () => {
                setTapFaceIndex((prev) => (prev + 1) % faces.length);
                if (onClick) onClick();
            };

            const mascotVariants = {
                idle: { y: [0, -6, 0], transition: { duration: 2.5, repeat: Infinity, ease: "easeInOut" } },
                typing: { scale: [1, 1.05, 1], rotate: [0, 2, -2, 0], transition: { duration: 0.3, repeat: Infinity } },
                thinking: { rotate: [0, 360], transition: { duration: 2, repeat: Infinity, ease: "linear" } },
                celebrate: { y: [0, -20, 0], scale: [1, 1.15, 1], transition: { duration: 0.4, repeat: 3 } },
                sad: { y: [0, 6, 0], opacity: 0.8, transition: { duration: 1.5, repeat: Infinity } }
            };

            const activeFace = faces[tapFaceIndex];

            return (
                <div className="relative w-28 h-28 mx-auto cursor-pointer select-none group" onClick={handleTap}>
                    <motion.div animate={mascotVariants[state] || mascotVariants.idle} className="w-full h-full">
                        <svg viewBox="0 0 16 16" className="w-full h-full drop-shadow-[0_4px_16px_rgba(56,189,248,0.5)]" style={{ shapeRendering: 'crispEdges' }}>
                            {/* Ears */}
                            <rect x="2" y="1" width="3" height="4" fill="#38bdf8" />
                            <rect x="3" y="2" width="1" height="2" fill="#818cf8" />
                            <rect x="11" y="1" width="3" height="4" fill="#38bdf8" />
                            <rect x="12" y="2" width="1" height="2" fill="#818cf8" />

                            {/* Head Base */}
                            <rect x="2" y="4" width="12" height="9" fill="#38bdf8" />
                            <rect x="3" y="13" width="10" height="1" fill="#38bdf8" />

                            {/* Cheek Details */}
                            <rect x="1" y="7" width="1" height="4" fill="#0284c7" />
                            <rect x="14" y="7" width="1" height="4" fill="#0284c7" />

                            {/* Dynamic Tap Eyes & Features */}
                            {activeFace === 'derp' ? (
                                <>
                                    <rect x="3" y="6" width="2" height="2" fill="#020617" />
                                    <rect x="11" y="8" width="2" height="2" fill="#020617" />
                                </>
                            ) : activeFace === 'glasses' ? (
                                <>
                                    <rect x="3" y="6" width="4" height="3" fill="#020617" />
                                    <rect x="9" y="6" width="4" height="3" fill="#020617" />
                                    <rect x="7" y="7" width="2" height="1" fill="#020617" />
                                </>
                            ) : activeFace === 'cool' ? (
                                <>
                                    <rect x="4" y="7" width="2" height="2" fill="#38bdf8" />
                                    <rect x="10" y="7" width="2" height="2" fill="#38bdf8" />
                                </>
                            ) : activeFace === 'surprised' ? (
                                <>
                                    <rect x="4" y="6" width="2" height="3" fill="#020617" />
                                    <rect x="10" y="6" width="2" height="3" fill="#020617" />
                                </>
                            ) : state === 'thinking' ? (
                                <>
                                    <rect x="4" y="7" width="3" height="1" fill="#020617" />
                                    <rect x="9" y="7" width="3" height="1" fill="#020617" />
                                </>
                            ) : state === 'sad' ? (
                                <>
                                    <rect x="4" y="8" width="2" height="1" fill="#020617" />
                                    <rect x="10" y="8" width="2" height="1" fill="#020617" />
                                </>
                            ) : (
                                <>
                                    <rect x="4" y="7" width="2" height="2" fill="#020617" />
                                    <rect x="10" y="7" width="2" height="2" fill="#020617" />
                                    <rect x="4" y="7" width="1" height="1" fill="#ffffff" />
                                    <rect x="10" y="7" width="1" height="1" fill="#ffffff" />
                                </>
                            )}

                            {/* Nose */}
                            <rect x="7" y="9" width="2" height="1" fill="#818cf8" />

                            {/* Mouth */}
                            {activeFace === 'surprised' ? (
                                <rect x="7" y="11" width="2" height="2" fill="#020617" />
                            ) : activeFace === 'cool' ? (
                                <rect x="6" y="11" width="4" height="1" fill="#38bdf8" />
                            ) : (
                                <>
                                    <rect x="6" y="10" width="1" height="1" fill="#020617" />
                                    <rect x="9" y="10" width="1" height="1" fill="#020617" />
                                    <rect x="7" y="11" width="2" height="1" fill="#020617" />
                                </>
                            )}

                            {/* Whiskers */}
                            <rect x="0" y="8" width="2" height="1" fill="#ffffff" />
                            <rect x="0" y="10" width="2" height="1" fill="#ffffff" />
                            <rect x="14" y="8" width="2" height="1" fill="#ffffff" />
                            <rect x="14" y="10" width="2" height="1" fill="#ffffff" />
                        </svg>
                    </motion.div>
                    <div className="absolute -bottom-4 left-1/2 -translate-x-1/2 text-[9px] pixel-font text-sky-400 opacity-0 group-hover:opacity-100 transition">
                        TAP ME!
                    </div>
                </div>
            );
        };

        // --- SPACE POD SLANG POPPING MINI-GAME COMPONENT ---
        const InteractivePopGame = () => {
            const [score, setScore] = useState(0);
            const [pods, setPods] = useState([]);

            const spawnPod = () => {
                const id = Date.now() + Math.random();
                const word = TARGET_WORDS[Math.floor(Math.random() * TARGET_WORDS.length)];
                const x = Math.random() * 75 + 10;
                setPods(prev => [...prev.slice(-6), { id, word, x }]);
            };

            useEffect(() => {
                const interval = setInterval(spawnPod, 1200);
                return () => clearInterval(interval);
            }, []);

            const popPod = (id) => {
                setScore(s => s + 10);
                setPods(prev => prev.filter(t => t.id !== id));
                if (window.confetti) window.confetti({ particleCount: 25, spread: 40 });
            };

            return (
                <div className="relative w-full h-80 game-pixel-bg rounded-2xl border-2 border-sky-400/60 overflow-hidden p-4 flex flex-col justify-between shadow-2xl">
                    <div className="flex justify-between items-center z-10">
                        <span className="pixel-font text-xs text-sky-400">COSMIC SLANG PODS</span>
                        <span className="pixel-font text-xs text-indigo-300 bg-slate-950/80 px-3 py-1.5 rounded border border-sky-500/40">
                            SCORE: {score}
                        </span>
                    </div>

                    <div className="relative flex-1 w-full mt-2">
                        <AnimatePresence>
                            {pods.map(pod => (
                                <motion.div
                                    key={pod.id}
                                    initial={{ y: 200, opacity: 1, scale: 0.8 }}
                                    animate={{ y: -40, opacity: 1, scale: 1 }}
                                    exit={{ scale: 0, opacity: 0 }}
                                    transition={{ duration: 3.2, ease: "linear" }}
                                    onClick={() => popPod(pod.id)}
                                    style={{ left: `${pod.x}%` }}
                                    className="absolute cursor-pointer select-none bg-indigo-950 border-2 border-sky-400 p-2 rounded-lg text-center shadow-[0_0_12px_rgba(56,189,248,0.4)] hover:scale-110 active:scale-90"
                                >
                                    <div className="text-lg">🛸</div>
                                    <div className="pixel-font text-[9px] text-sky-200 font-bold mt-1">{pod.word}</div>
                                </motion.div>
                            ))}
                        </AnimatePresence>
                    </div>

                    <p className="text-center text-xs pixel-font text-slate-400 z-10 bg-slate-950/60 py-1.5 rounded border border-slate-800">
                        Tap floating Space Pods to harvest Aura Points!
                    </p>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [selectedStyle, setSelectedStyle] = useState('genz');
            const [inputText, setInputText] = useState('');
            const [translatedText, setTranslatedText] = useState('');
            const [history, setHistory] = useState([]);
            const [mascotState, setMascotState] = useState('idle');
            
            // Game State
            const [user, setUser] = useState(null);
            const [usernameInput, setUsernameInput] = useState('');
            const [currentPromptIndex, setCurrentPromptIndex] = useState(0);
            const [gameInput, setGameInput] = useState('');
            const [evaluating, setEvaluating] = useState(false);
            const [scoreModal, setScoreModal] = useState(null);
            const [leaderboard, setLeaderboard] = useState([]);

            useEffect(() => {
                const savedLB = JSON.parse(localStorage.getItem('genz_arena_lb') || '[]');
                if (savedLB.length === 0) {
                    const mockLB = [
                        { id: 1, username: 'RizzGod99', total_aura: 1850, highest_score: 98, games_played: 20, badges: ['GigaChad Supreme', 'Sigma Master'] },
                        { id: 2, username: 'SkibidiKing', total_aura: 1120, highest_score: 92, games_played: 14, badges: ['Aura Overlord'] },
                        { id: 3, username: 'GyattWatcher', total_aura: 640, highest_score: 85, games_played: 8, badges: ['Aura Apprentice'] }
                    ];
                    setLeaderboard(mockLB);
                    localStorage.setItem('genz_arena_lb', JSON.stringify(mockLB));
                } else {
                    setLeaderboard(savedLB);
                }
            }, []);

            const handleTranslate = () => {
                if (!inputText.trim()) return;
                setMascotState('thinking');
                
                setTimeout(() => {
                    let result = "";
                    const words = inputText.split(/\s+/);

                    if (selectedStyle === 'genz') {
                        const translated = words.map(w => {
                            const clean = w.toLowerCase().replace(/[^\w]/g, "");
                            return GENZ_DICT[clean] ? w.toLowerCase().replace(clean, GENZ_DICT[clean]) : w;
                        });
                        result = translated.join(" ") + SUFFIXES[Math.floor(Math.random() * SUFFIXES.length)];
                    } else if (selectedStyle === 'reverse') {
                        const reverseMap = Object.fromEntries(Object.entries(GENZ_DICT).map(([k, v]) => [v, k]));
                        result = words.map(w => reverseMap[w.toLowerCase()] || w).join(" ");
                    } else if (selectedStyle === 'shakespeare') {
                        result = "Hark! " + words.map(w => w + "eth").join(" ") + ", verily fine sir.";
                    } else if (selectedStyle === 'british') {
                        result = "Allow it fam, " + words.join(" ") + " is proper mad innit, bruv.";
                    } else if (selectedStyle === 'pirate') {
                        result = "Ahoy matey! " + words.join(" ") + " by order of Cap'n!";
                    } else {
                        result = "It is hereby formally recognized that " + words.join(" ") + ".";
                    }

                    setTranslatedText(result);
                    setHistory(prev => [{ id: Date.now(), original: inputText, translated: result, style: selectedStyle }, ...prev.slice(0, 4)]);
                    setMascotState('celebrate');
                    setTimeout(() => setMascotState('idle'), 2000);
                }, 400);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!usernameInput.trim()) return;
                
                const existing = leaderboard.find(u => u.username.toLowerCase() === usernameInput.trim().toLowerCase());
                const currentUser = existing || {
                    id: Date.now(),
                    username: usernameInput.trim(),
                    total_aura: 0,
                    highest_score: 0,
                    games_played: 0,
                    badges: []
                };
                
                setUser(currentUser);
            };

            const evaluateGameSubmission = () => {
                if (!gameInput.trim()) return;
                setEvaluating(true);
                setMascotState('thinking');

                setTimeout(() => {
                    const wordCount = gameInput.trim().split(/\s+/).length;
                    const slangMatches = Object.values(GENZ_DICT).filter(slang => gameInput.toLowerCase().includes(slang)).length;

                    const slangScore = Math.min(100, slangMatches * 30 + 20);
                    const naturalness = wordCount >= 4 && slangMatches <= 3 ? 88 : 55;
                    const meaning = 82;
                    const creativity = Math.min(100, 45 + slangMatches * 15);
                    const overall = Math.round((slangScore + naturalness + meaning + creativity) / 4);

                    const newTotalAura = user.total_aura + overall;
                    const newHighest = Math.max(user.highest_score, overall);
                    const newGames = user.games_played + 1;

                    const updatedBadges = [...(user.badges || [])];
                    if (overall >= 90 && !updatedBadges.includes('Sigma Master')) updatedBadges.push('Sigma Master');
                    if (newTotalAura >= 500 && !updatedBadges.includes('Aura Overlord')) updatedBadges.push('Aura Overlord');

                    const updatedUser = { ...user, total_aura: newTotalAura, highest_score: newHighest, games_played: newGames, badges: updatedBadges };
                    setUser(updatedUser);

                    const newLB = leaderboard.map(u => u.id === updatedUser.id ? updatedUser : u);
                    if (!newLB.some(u => u.id === updatedUser.id)) newLB.push(updatedUser);
                    newLB.sort((a, b) => b.total_aura - a.total_aura);
                    
                    setLeaderboard(newLB);
                    localStorage.setItem('genz_arena_lb', JSON.stringify(newLB));

                    const resultData = {
                        overall,
                        meaning,
                        slangScore,
                        naturalness,
                        creativity,
                        feedback: overall > 75 ? "W submission fr fr, you locked in!" : "Kind of mid, needs more brainrot energy."
                    };

                    setScoreModal(resultData);
                    setEvaluating(false);

                    if (overall >= 70) {
                        setMascotState('celebrate');
                        if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    } else {
                        setMascotState('sad');
                    }
                }, 1000);
            };

            const nextPrompt = () => {
                setScoreModal(null);
                setGameInput('');
                setCurrentPromptIndex((prev) => (prev + 1) % PROMPTS.length);
                setMascotState('idle');
            };

            return (
                <div className="min-h-screen flex flex-col relative overflow-hidden">
                    {/* NIGHT SKY BACKGROUND WITH FLOATING PLANETS */}
                    <CosmicBackground />

                    {/* NAVBAR */}
                    <nav className="border-b-2 border-sky-500/40 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-xl">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                            <span className="text-2xl">🐱</span>
                            <span className="pixel-font font-bold text-xs md:text-sm text-sky-400 drop-shadow-[0_2px_4px_rgba(56,189,248,0.4)]">Nyan Slang Lab</span>
                        </div>

                        <div className="flex space-x-2 md:space-x-3">
                            {['home', 'translator', 'arcade', 'arena', 'leaderboard'].map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`px-3 py-1.5 md:px-4 md:py-2 rounded text-[10px] md:text-xs pixel-font uppercase transition border ${
                                        activeTab === tab 
                                            ? 'bg-sky-500 text-slate-950 border-sky-300 shadow-[0_0_12px_rgba(56,189,248,0.5)] font-bold' 
                                            : 'bg-slate-900/80 text-sky-300 border-slate-700 hover:bg-slate-800'
                                    }`}
                                >
                                    {tab === 'arena' ? 'Aura Arena' : tab}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 relative z-10">
                        
                        {/* HOME TAB */}
                        {activeTab === 'home' && (
                            <div className="text-center py-8 md:py-12 space-y-8 relative">
                                <Mascot state={mascotState} />

                                <div className="space-y-4 max-w-2xl mx-auto cosmic-card p-6 md:p-8 rounded-2xl relative">
                                    <h1 className="text-xl md:text-3xl pixel-font font-extrabold text-sky-400 leading-relaxed drop-shadow-[0_3px_0_#000]">
                                        NYAN SLANG LAB <br/><span className="text-indigo-400">& ARENA</span>
                                    </h1>
                                    <p className="text-slate-300 text-xs md:text-sm leading-relaxed">
                                        Tap the space cat to swap faces! Translate English into slang, burst orbital Space Pods in the Arcade, or battle for Aura rank!
                                    </p>
                                </div>

                                <div className="flex flex-col sm:flex-row justify-center gap-4 pt-2">
                                    <button 
                                        onClick={() => setActiveTab('translator')}
                                        className="px-6 py-4 bg-sky-500 border-2 border-sky-300 text-slate-950 rounded-xl font-bold pixel-font text-xs hover:bg-sky-400 hover:scale-105 transition shadow-[0_0_20px_rgba(56,189,248,0.4)]"
                                    >
                                        Slang Translator 🚀
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('arcade')}
                                        className="px-6 py-4 bg-indigo-600 border-2 border-indigo-400 text-white rounded-xl font-bold pixel-font text-xs hover:bg-indigo-500 hover:scale-105 transition shadow-[0_0_20px_rgba(99,102,241,0.4)]"
                                    >
                                        Space Pod Arcade 🛸
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* TRANSLATOR TAB */}
                        {activeTab === 'translator' && (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between cosmic-card p-4 rounded-xl">
                                    <h2 className="text-sm md:text-base pixel-font font-bold text-sky-400">Slang Translator</h2>
                                    <Mascot state={mascotState} />
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                    {STYLES.map(style => (
                                        <div
                                            key={style.id}
                                            onClick={() => setSelectedStyle(style.id)}
                                            className={`p-4 rounded-xl border cursor-pointer transition-all flex flex-col space-y-1 ${
                                                selectedStyle === style.id
                                                    ? 'border-sky-400 bg-sky-950/80 text-sky-200 shadow-[0_0_12px_rgba(56,189,248,0.3)]'
                                                    : 'border-slate-800 bg-slate-900/80 text-slate-400 hover:border-slate-700'
                                            }`}
                                        >
                                            <div className="flex items-center space-x-2">
                                                <span className="text-xl">{style.icon}</span>
                                                <span className="font-bold text-xs text-sky-300">{style.name}</span>
                                            </div>
                                            <span className="text-[10px] text-slate-400">{style.desc}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-3">
                                    <textarea
                                        value={inputText}
                                        onChange={(e) => {
                                            setInputText(e.target.value);
                                            setMascotState(e.target.value ? 'typing' : 'idle');
                                        }}
                                        placeholder="Type standard English sentence here..."
                                        className="w-full h-32 p-4 cosmic-box rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-sky-400 transition"
                                    />
                                    <div className="flex gap-2">
                                        <button
                                            onClick={handleTranslate}
                                            className="flex-1 py-3 bg-sky-500 border-2 border-sky-300 text-slate-950 font-bold pixel-font text-xs rounded-xl hover:bg-sky-400 transition shadow-md"
                                        >
                                            Translate Sentence
                                        </button>
                                        <button
                                            onClick={() => { setInputText(''); setTranslatedText(''); setMascotState('idle'); }}
                                            className="px-4 py-3 bg-slate-900 border border-slate-700 text-slate-400 rounded-xl hover:text-white"
                                        >
                                            Clear
                                        </button>
                                    </div>
                                </div>

                                {translatedText && (
                                    <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className="p-5 cosmic-card rounded-xl space-y-2 relative">
                                        <div className="text-[10px] pixel-font font-bold text-sky-400 uppercase tracking-wider">Converted Output</div>
                                        <div className="text-base font-bold text-slate-100 pr-16">{translatedText}</div>
                                        <button
                                            onClick={() => navigator.clipboard.writeText(translatedText)}
                                            className="absolute top-4 right-4 text-xs bg-slate-800 text-sky-300 border border-slate-700 px-3 py-1 rounded-lg hover:bg-slate-700"
                                        >
                                            Copy
                                        </button>
                                    </motion.div>
                                )}
                            </div>
                        )}

                        {/* ARCADE GAME TAB */}
                        {activeTab === 'arcade' && (
                            <div className="space-y-4 max-w-2xl mx-auto">
                                <div className="flex justify-between items-center bg-slate-900/90 border border-sky-500/40 p-3 rounded-xl">
                                    <span className="pixel-font text-xs text-sky-400">COSMIC MINI-GAME</span>
                                    <span className="text-xs text-slate-400">Harvest Space Pods for points!</span>
                                </div>
                                <InteractivePopGame />
                            </div>
                        )}

                        {/* COMPETITIVE GAME TAB */}
                        {activeTab === 'arena' && (
                            <div className="max-w-2xl mx-auto space-y-6">
                                {!user ? (
                                    <form onSubmit={handleLogin} className="p-8 cosmic-card rounded-2xl text-center space-y-4">
                                        <Mascot state="idle" />
                                        <h2 className="text-sm md:text-base pixel-font font-bold text-sky-400">Enter Aura Arena</h2>
                                        <p className="text-slate-300 text-xs">Choose a username to track your Aura rank and join the cosmic leaderboard.</p>
                                        <input
                                            type="text"
                                            value={usernameInput}
                                            onChange={(e) => setUsernameInput(e.target.value)}
                                            placeholder="Enter Username..."
                                            className="w-full p-3 cosmic-box rounded-xl text-center font-bold focus:outline-none focus:ring-2 focus:ring-sky-400"
                                        />
                                        <button type="submit" className="w-full py-3 bg-sky-500 border-2 border-sky-300 text-slate-950 font-bold pixel-font text-xs rounded-xl hover:bg-sky-400 transition shadow-md">
                                            Start Playing
                                        </button>
                                    </form>
                                ) : (
                                    <div className="p-6 game-pixel-bg border-2 border-sky-400/60 rounded-2xl space-y-6 shadow-2xl">
                                        <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                            <div>
                                                <h3 className="text-sm pixel-font font-bold text-sky-400">{user.username}</h3>
                                                <div className="flex items-center space-x-2 text-xs text-slate-400">
                                                    <span>{getRankInfo(user.total_aura).icon} {getRankInfo(user.total_aura).title}</span>
                                                    <span>•</span>
                                                    <span>{user.total_aura} Aura</span>
                                                </div>
                                            </div>
                                            <Mascot state={evaluating ? 'thinking' : 'idle'} />
                                        </div>

                                        <div className="p-4 bg-slate-950/80 border border-slate-800 rounded-xl space-y-1">
                                            <span className="text-[10px] pixel-font font-bold text-sky-400 uppercase tracking-wider">Rewrite in Gen Z Slang:</span>
                                            <p className="text-sm text-slate-200 font-medium">"{PROMPTS[currentPromptIndex]}"</p>
                                        </div>

                                        <textarea
                                            value={gameInput}
                                            onChange={(e) => setGameInput(e.target.value)}
                                            placeholder="Type your slang version..."
                                            className="w-full h-28 p-4 cosmic-box rounded-xl font-semibold focus:outline-none focus:ring-2 focus:ring-sky-400"
                                        />

                                        <button
                                            onClick={evaluateGameSubmission}
                                            disabled={evaluating}
                                            className="w-full py-3 bg-sky-500 border-2 border-sky-300 pixel-font text-xs font-bold text-slate-950 rounded-xl hover:bg-sky-400 transition shadow-md disabled:opacity-50"
                                        >
                                            {evaluating ? "Evaluating Aura..." : "Submit Answer 🚀"}
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* LEADERBOARD TAB */}
                        {activeTab === 'leaderboard' && (
                            <div className="space-y-6">
                                <h2 className="text-sm md:text-base pixel-font font-bold text-sky-400 text-center drop-shadow-[0_2px_4px_rgba(56,189,248,0.4)]">Global Aura Leaderboard</h2>
                                <div className="p-4 cosmic-card rounded-2xl space-y-3">
                                    {leaderboard.map((player, index) => {
                                        const rank = getRankInfo(player.total_aura);
                                        return (
                                            <div key={player.id} className="flex items-center justify-between p-3 bg-slate-950/80 rounded-xl border border-slate-800">
                                                <div className="flex items-center space-x-3">
                                                    <span className={`font-black text-sm pixel-font ${index === 0 ? 'text-amber-400' : index === 1 ? 'text-slate-300' : index === 2 ? 'text-amber-600' : 'text-slate-600'}`}>
                                                        #{index + 1}
                                                    </span>
                                                    <div>
                                                        <div className="font-bold text-xs text-slate-200">{player.username}</div>
                                                        <div className="text-[10px] text-sky-400">{rank.icon} {rank.title}</div>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-bold text-xs text-sky-300">{player.total_aura} Aura</div>
                                                    <div className="text-[10px] text-slate-500">{player.games_played} Games Played</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* EVALUATION MODAL */}
                    {scoreModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="cosmic-card p-6 rounded-2xl max-w-md w-full space-y-4 text-center">
                                <h3 className="text-sm pixel-font font-extrabold text-sky-400">Aura Evaluation</h3>
                                <div className="text-3xl pixel-font font-black text-indigo-300 drop-shadow-[0_2px_4px_rgba(99,102,241,0.5)]">+{scoreModal.overall} Aura</div>
                                <p className="text-xs text-slate-300 font-medium">"{scoreModal.feedback}"</p>
                                
                                <div className="grid grid-cols-2 gap-2 text-[10px] pixel-font py-2">
                                    <div className="p-2 bg-slate-950 rounded-lg border border-slate-800">
                                        <div className="text-slate-400">Slang Level</div>
                                        <div className="font-bold text-sky-400">{scoreModal.slangScore}%</div>
                                    </div>
                                    <div className="p-2 bg-slate-950 rounded-lg border border-slate-800">
                                        <div className="text-slate-400">Creativity</div>
                                        <div className="font-bold text-indigo-300">{scoreModal.creativity}%</div>
                                    </div>
                                </div>

                                <button
                                    onClick={nextPrompt}
                                    className="w-full py-3 bg-sky-500 border-2 border-sky-300 text-slate-950 pixel-font text-xs font-bold rounded-xl hover:bg-sky-400 transition shadow-md"
                                >
                                    Next Challenge 🚀
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
